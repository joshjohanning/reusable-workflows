version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/gh-aw-upgrade"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "America/Chicago"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
