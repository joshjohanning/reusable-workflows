name: Upgrade Agentic Workflows

# Reusable workflow that upgrades GitHub Agentic Workflows (gh-aw) in the
# calling repository and opens a pull request for review. It never merges.
#
# Credentials: pass either a GitHub App (app-client-id input + app-private-key
# secret) or a PAT (token secret). The token needs Contents, Pull requests, and
# Workflows write access; GITHUB_TOKEN cannot push changes to workflow files.

on:
  workflow_call:
    inputs:
      gh-aw-version:
        description: "gh-aw version to upgrade to (e.g. v1.2.2), or 'latest' for the latest stable release"
        required: false
        type: string
        default: latest
      approve:
        description: "Pass --approve to gh aw upgrade to accept safe-update manifest changes"
        required: false
        type: boolean
        default: false
      pin-actions-to-sha:
        description: "Recompile with --action-mode action --action-tag <setup-cli SHA> (for repos whose locks are compiled that way)"
        required: false
        type: boolean
        default: false
      base-branch:
        description: "Branch to upgrade and target with the PR (defaults to the repository default branch)"
        required: false
        type: string
        default: ""
      app-client-id:
        description: "GitHub App client ID used to mint an installation token (use with the app-private-key secret)"
        required: false
        type: string
        default: ""
    secrets:
      app-private-key:
        description: "GitHub App private key (use with the app-client-id input)"
        required: false
      token:
        description: "PAT with Contents, Pull requests, and Workflows write access (used when no GitHub App is provided)"
        required: false
    outputs:
      pull-request-url:
        description: "URL of the opened upgrade PR, if any"
        value: ${{ jobs.upgrade.outputs.pull-request-url }}

permissions:
  contents: read

jobs:
  upgrade:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pull-request-url: ${{ steps.pr.outputs.url }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        if: ${{ inputs.app-client-id != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Resolve token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PAT: ${{ secrets.token }}
        run: |
          set -euo pipefail
          if [ -n "$APP_TOKEN" ]; then
            token="$APP_TOKEN"
            name="${APP_SLUG}[bot]"
            user_id="$(GH_TOKEN="$token" gh api "/users/${name}" --jq .id)"
            email="${user_id}+${name}@users.noreply.github.com"
          elif [ -n "$PAT" ]; then
            token="$PAT"
            name="github-actions[bot]"
            email="41898282+github-actions[bot]@users.noreply.github.com"
          else
            echo "::error::Provide app-client-id + app-private-key, or a token secret with Contents, Pull requests, and Workflows write access."
            exit 1
          fi
          echo "::add-mask::$token"
          {
            echo "token=$token"
            echo "git-name=$name"
            echo "git-email=$email"
          } >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-branch || github.event.repository.default_branch }}
          token: ${{ steps.auth.outputs.token }}

      - name: Resolve target gh-aw version
        id: version
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          REQUESTED: ${{ inputs.gh-aw-version }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = "latest" ]; then
            version="$(gh api repos/github/gh-aw/releases/latest --jq .tag_name)"
          else
            version="$REQUESTED"
          fi
          # Prefer the peeled commit for annotated tags.
          refs="$(git ls-remote https://github.com/github/gh-aw-actions.git "refs/tags/${version}" "refs/tags/${version}^{}")"
          sha="$(awk '/\^\{\}$/ {print $1}' <<<"$refs")"
          [ -n "$sha" ] || sha="$(awk 'NR==1 {print $1}' <<<"$refs")"
          if [ -z "$sha" ]; then
            echo "::error::Could not resolve github/gh-aw-actions tag ${version}."
            exit 1
          fi
          echo "Target gh-aw version: $version ($sha)"
          {
            echo "version=$version"
            echo "setup-cli-sha=$sha"
            echo "branch=gh-aw-upgrade/${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether an upgrade is needed
        id: check
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$existing" ]; then
            echo "Upgrade PR for $VERSION is already open: $existing"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          shopt -s nullglob
          locks=(.github/workflows/*.lock.yml)
          if [ "${#locks[@]}" -eq 0 ]; then
            echo "::error::No compiled agentic workflow lock files found in .github/workflows."
            exit 1
          fi

          needed=false
          for lock in "${locks[@]}"; do
            if ! grep -q "\"compiler_version\":\"${VERSION}\"" "$lock"; then
              echo "$lock is not compiled with $VERSION"
              needed=true
            fi
          done
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Install gh-aw
        if: steps.check.outputs.needed == 'true'
        uses: github/gh-aw-actions/setup-cli@53d0749e19424a918acd82b4d140264ce48f2f14 # v1.2.2
        with:
          version: ${{ steps.version.outputs.version }}
          github-token: ${{ steps.auth.outputs.token }}

      - name: Run gh aw upgrade
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          APPROVE: ${{ inputs.approve }}
        run: |
          set -euo pipefail
          gh aw version
          args=(--skip-extension-upgrade)
          if [ "$APPROVE" = "true" ]; then
            args+=(--approve)
          fi
          gh aw upgrade "${args[@]}"

      - name: Sync remaining gh-aw setup-cli pins
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NEW_SHA: ${{ steps.version.outputs.setup-cli-sha }}
        run: |
          set -euo pipefail
          # gh aw upgrade updates copilot-setup-steps.yml, but other workflows
          # (e.g. compile validation) may also pin setup-cli or --action-tag.
          mapfile -t files < <(grep -lE 'github/gh-aw-actions/setup-cli@' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | grep -v '\.lock\.yml$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          mapfile -t old_shas < <(grep -ohE 'github/gh-aw-actions/setup-cli@[0-9a-f]{40}' "${files[@]}" \
            | sed 's/.*@//' | sort -u | grep -vx "$NEW_SHA" || true)
          for file in "${files[@]}"; do
            for old in "${old_shas[@]}"; do
              sed -i "s/${old}/${NEW_SHA}/g" "$file"
            done
            sed -i -E \
              -e "s|(github/gh-aw-actions/setup-cli@${NEW_SHA}) # v[0-9][^ ]*|\1 # ${VERSION}|" \
              -e "/github\/gh-aw-actions\/setup-cli@/,/^[[:space:]]*- /s|^([[:space:]]*version:[[:space:]]*)['\"]?v[0-9]+\.[0-9]+\.[0-9]+[^'\" ]*['\"]?[[:space:]]*$|\1${VERSION}|" \
              "$file"
          done
          git --no-pager diff --stat

      - name: Recompile with SHA-pinned gh-aw actions
        if: steps.check.outputs.needed == 'true' && inputs.pin-actions-to-sha
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          NEW_SHA: ${{ steps.version.outputs.setup-cli-sha }}
        run: gh aw compile --no-check-update --action-mode action --action-tag "$NEW_SHA"

      - name: Open pull request
        id: pr
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
          BASE: ${{ inputs.base-branch || github.event.repository.default_branch }}
          GIT_NAME: ${{ steps.auth.outputs.git-name }}
          GIT_EMAIL: ${{ steps.auth.outputs.git-email }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "gh aw upgrade produced no changes."
            exit 0
          fi

          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git switch -c "$BRANCH"
          git add --all -- .github
          if [ -f .gitattributes ]; then
            git add -- .gitattributes
          fi
          git commit -m "chore: upgrade agentic workflows to gh-aw ${VERSION}"
          git push --set-upstream origin "$BRANCH"

          url="$(gh pr create --base "$BASE" --head "$BRANCH" \
            --title "chore: upgrade agentic workflows to gh-aw ${VERSION}" \
            --body-file - <<EOF
          Automated upgrade of GitHub Agentic Workflows to [gh-aw ${VERSION}](https://github.com/github/gh-aw/releases/tag/${VERSION}).

          Generated by \`gh aw upgrade\` (codemods, action pins, agent and skill files, recompiled lock files), plus syncing other \`github/gh-aw-actions/setup-cli\` pins to ${VERSION}.

          Review the diff and CI results before merging.
          EOF
          )"
          echo "Opened $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

          # Close older upgrade PRs that this one supersedes.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"gh-aw-upgrade/\")) | select(.headRefName != \"${BRANCH}\") | .number" \
            | while read -r number; do
                gh pr close "$number" --delete-branch --comment "Superseded by $url."
              done
